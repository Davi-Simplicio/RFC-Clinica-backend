spring.application.name=saudefem-backend

# Configuracao padrao em memoria H2 (para testes rapidos da camada JPA)
spring.datasource.url=jdbc:h2:mem:saudefemdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracao PostgreSQL (Producao / Homologacao)
# spring.datasource.url=jdbc:postgresql://localhost:5432/saudefem_rfcc
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
